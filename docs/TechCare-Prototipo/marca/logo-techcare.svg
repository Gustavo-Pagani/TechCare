  </defs>
  <rect width="62" height="62" rx="18" ry="18" fill="url(#tc)"/>
  <text x="31" y="31.75" fill="#ffffff" font-family="Manrope, 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="17" text-anchor="middle" dominant-baseline="central">TC</text>
</svg>
