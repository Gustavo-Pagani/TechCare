<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 62" width="512" height="512" role="img" aria-label="TechCare">
  <title>TechCare</title>
  <defs>
    <!-- corte diagonal seco: as duas paradas ficam a 1% de distancia, como no CSS original -->
